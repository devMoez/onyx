<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onyx UI - Standalone</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Space Mono', 'Courier New', monospace;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(160, 175, 190, 0.32) 1px, transparent 1px);
      background-size: 18px 18px;
      pointer-events: none;
      z-index: 0;
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 0%, black 22%, transparent 58%);
      mask-image: radial-gradient(ellipse at 50% 50%, black 0%, black 22%, transparent 58%);
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(160, 175, 190, 0.10) 1px, transparent 1px);
      background-size: 28px 28px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, transparent 25%, black 50%, black 70%, transparent 100%);
      mask-image: radial-gradient(ellipse at 50% 50%, transparent 25%, black 50%, black 70%, transparent 100%);
      pointer-events: none;
      z-index: 1;
    }

    .wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .status-line {
      margin-top: 10px;
      height: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      letter-spacing: 0.18em;
      color: rgba(0, 210, 255, 0.5);
      text-transform: uppercase;
      user-select: none;
      transition: color 600ms ease;
    }

    .status-line.processing {
      color: rgba(0, 255, 185, 0.65);
    }

    .status-cursor {
      display: inline-block;
      width: 5px;
      height: 10px;
      background: rgba(0, 210, 255, 0.5);
      animation: cursorBlink 1.1s step-end infinite;
      vertical-align: middle;
      transition: background 600ms ease;
    }

    .status-line.processing .status-cursor {
      background: rgba(0, 255, 185, 0.65);
    }

    .dock {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: transparent;
      border: none;
    }

    .dock-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(160, 175, 190, 0.13);
      background: rgba(160, 175, 190, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 180ms ease;
      position: relative;
      opacity: 0;
      transform: scale(0.7) translateY(4px);
    }

    .dock-btn:hover {
      background: rgba(160, 175, 190, 0.09);
      border-color: rgba(160, 175, 190, 0.28);
      transform: translateY(-2px) scale(1);
    }

    .dock-btn:active {
      transform: translateY(0) scale(0.97);
    }

    .dock-btn svg {
      width: 18px;
      height: 18px;
      stroke: rgba(165, 178, 192, 0.7);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 180ms ease;
    }

    .dock-btn:hover svg {
      stroke: rgba(200, 212, 224, 0.95);
    }

    .dock-btn.active {
      background: rgba(160, 175, 190, 0.11);
      border-color: rgba(165, 178, 192, 0.32);
    }

    .dock-btn.active svg {
      stroke: rgba(215, 225, 235, 1);
    }

    .dock-btn.active::after {
      content: '';
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(195, 210, 225, 0.85);
    }

    .live-dot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #e03;
      box-shadow: 0 0 5px rgba(238, 0, 51, 0.7);
      animation: blink 1.4s ease-in-out infinite;
    }

    .dock-btn.boot-glow {
      box-shadow: 0 0 18px rgba(0, 210, 255, 0.28), 0 0 6px rgba(0, 210, 255, 0.15);
    }

    .dock-btn[data-tip]::before {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      font-family: 'Space Mono', 'Courier New', monospace;
      font-size: 8px;
      letter-spacing: 0.12em;
      color: rgba(160, 175, 190, 0.75);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .dock-btn[data-tip]:hover::before {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      max-width: 600px;
      width: 90%;
      background: rgba(105, 115, 125, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      padding: 32px;
      color: rgba(200, 210, 220, 1);
      font-size: 14px;
      line-height: 1.6;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      font-size: 20px;
      transition: color 200ms;
    }

    .modal-close:hover {
      color: rgba(255, 255, 255, 1);
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <canvas id="orb" style="position: relative; z-index: 2;"></canvas>
    <canvas id="wave" style="position: relative; z-index: 2; margin-top: -6px;"></canvas>

    <div class="status-line" id="statusLine">
      <span id="statusText">STANDBY</span>
      <span class="status-cursor"></span>
    </div>

    <div class="dock">
      <button class="dock-btn" id="btnMic" title="Live Camera" data-tip="[ V ]">
        <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </button>
      <button class="dock-btn" id="btnArtifact" title="Artifact" data-tip="[ A ]">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      </button>
      <button class="dock-btn" id="btnScreen" title="Screen Share" data-tip="[ S ]">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </button>
      <button class="dock-btn" id="btnAuth" title="Setup LLM" data-tip="[ L ]">
        <svg viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M12 8v4"/>
          <path d="M12 16h.01"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Modals -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-content">
      <button class="modal-close" onclick="document.getElementById('authModal').classList.remove('active')">✕</button>
      <h2 style="color: rgba(0, 210, 255, 1); margin-bottom: 16px;">Setup LLM</h2>
      <p>Configure your LLM providers here.</p>
    </div>
  </div>

  <div class="modal-overlay" id="chatModal">
    <div class="modal-content" style="max-width: 800px; height: 80vh;">
      <button class="modal-close" onclick="document.getElementById('chatModal').classList.remove('active')">✕</button>
      <h2 style="color: rgba(0, 210, 255, 1); margin-bottom: 16px;">Chat</h2>
      <p>Chat interface here.</p>
    </div>
  </div>

  <div class="modal-overlay" id="artifactModal">
    <div class="modal-content" style="max-width: 1000px; height: 85vh;">
      <button class="modal-close" onclick="document.getElementById('artifactModal').classList.remove('active')">✕</button>
      <h2 style="color: rgba(0, 210, 255, 1); margin-bottom: 16px;">Artifacts</h2>
      <p>Artifact viewer here.</p>
    </div>
  </div>

  <script>
    const orbRef = document.getElementById('orb');
    const waveRef = document.getElementById('wave');
    const statusLine = document.getElementById('statusLine');
    const statusText = document.getElementById('statusText');
    const btnMic = document.getElementById('btnMic');
    const btnAuth = document.getElementById('btnAuth');
    const btnScreen = document.getElementById('btnScreen');
    const btnArtifact = document.getElementById('btnArtifact');
    const authModal = document.getElementById('authModal');
    const chatModal = document.getElementById('chatModal');
    const artifactModal = document.getElementById('artifactModal');

    let isListening = false;
    let isProcessing = false;

    const ctx = orbRef.getContext('2d');
    const wctx = waveRef.getContext('2d');
    const W = 520, H = 520;
    orbRef.width = W; orbRef.height = H;
    const cx = W/2, cy = H/2;
    const S = 520/680;

    let t = 0, boot = 0;
    const bootDuration = 120;
    let dockBooted = false;
    let speedMult = 1.0;
    let waveColorT = 0;

    const rings = [
      {r:148*S,speed:0.0018, dash:[14,7],width:0.7,alpha:0.5, dir:1, tickCount:60,labelEvery:10},
      {r:130*S,speed:-0.003, dash:[3,9], width:0.5,alpha:0.25,dir:-1,tickCount:0, labelEvery:0 },
      {r:114*S,speed:0.005,  dash:[1,0], width:1.1,alpha:0.65,dir:1, tickCount:48,labelEvery:8 },
      {r:98*S, speed:-0.007, dash:[5,5], width:0.5,alpha:0.3, dir:-1,tickCount:0, labelEvery:0 },
      {r:80*S, speed:0.011,  dash:[2,5], width:0.5,alpha:0.22,dir:1, tickCount:36,labelEvery:0 },
      {r:62*S, speed:-0.016, dash:[1,0], width:0.9,alpha:0.55,dir:-1,tickCount:0, labelEvery:0 },
    ];

    const arcs = [
      {ring:0,startA:0.2, span:1.2,width:2.2,alpha:0.85},
      {ring:0,startA:3.0, span:0.7,width:2.2,alpha:0.55},
      {ring:2,startA:0.6, span:2.0,width:2.8,alpha:0.95},
      {ring:2,startA:4.0, span:0.9,width:2.8,alpha:0.65},
      {ring:5,startA:1.2, span:2.6,width:2.0,alpha:0.8 },
    ];

    const dataLines = Array.from({length:10},(_,i)=>({
      angle:(i/10)*Math.PI*2,
      ring:(155+Math.random()*35)*S,
      len:14+Math.random()*28,
      alpha:0.12+Math.random()*0.22,
      speed:(Math.random()-0.5)*0.004,
      phase:Math.random()*Math.PI*2
    }));

    const hex = (a) => `rgba(0,210,255,${a})`;
    const grn = (a) => `rgba(0,255,185,${a})`;

    const WW = 260, WH = 40;
    waveRef.width = WW; waveRef.height = WH;

    let waveAmp = 0, waveTarget = 0.5;
    const IDLE_AMP = 0.08, LISTEN_AMP_MIN = 0.3, LISTEN_AMP_RANGE = 0.85;

    setInterval(() => {
      if(isListening) {
        waveTarget = LISTEN_AMP_MIN + Math.random() * LISTEN_AMP_RANGE;
      } else {
        waveTarget = IDLE_AMP + Math.random() * 0.06;
      }
    }, 700);

    function drawRing(ring, angle, p){
      const{r,dash,width,alpha}=ring;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
      ctx.beginPath();ctx.arc(0,0,r*p,0,Math.PI*2);
      ctx.setLineDash(dash[1]===0?[]:dash);
      ctx.strokeStyle=hex(alpha*Math.min(p*3,1));
      ctx.lineWidth=width;ctx.stroke();ctx.restore();
    }

    function drawTicks(ring, angle){
      if(!ring.tickCount)return;
      const{r,tickCount,labelEvery,alpha}=ring;
      for(let i=0;i<tickCount;i++){
        const a=angle+(i/tickCount)*Math.PI*2;
        const big=labelEvery&&i%labelEvery===0;
        ctx.save();ctx.translate(cx,cy);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*(r-(big?9:4)),Math.sin(a)*(r-(big?9:4)));
        ctx.lineTo(Math.cos(a)*(r+1),Math.sin(a)*(r+1));
        ctx.strokeStyle=hex(big?alpha*0.85:alpha*0.35);
        ctx.lineWidth=big?1.1:0.5;ctx.setLineDash([]);ctx.stroke();
        if(big&&labelEvery){
          const lx=Math.cos(a)*(r-16),ly=Math.sin(a)*(r-16);
          ctx.fillStyle=hex(0.28);ctx.font='7px Space Mono,Courier New';
          ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText(String(i).padStart(2,'0'),lx,ly);
        }
        ctx.restore();
      }
    }

    function drawAudioWave(p){
      wctx.clearRect(0,0,WW,WH);
      
      waveAmp += (waveTarget - waveAmp) * 0.045;
      waveColorT += ((isProcessing ? 1 : 0) - waveColorT) * 0.04;

      const centerY = WH / 2;
      const maxH = (WH / 2) - 3;
      const BARS = 38, barW = 2.2, gap = (WW - BARS * barW) / (BARS + 1);

      for(let i = 0; i < BARS; i++){
        const pos = i / (BARS - 1);
        const edge = Math.sin(pos * Math.PI);
        const h = ((Math.abs(Math.sin(i*0.48+t*0.09))*0.6 + Math.abs(Math.sin(i*0.82+t*0.06+1.3))*0.4) * edge * maxH * waveAmp * p) + 1.5;
        const x = gap + i * (barW + gap);
        const alpha = 0.35 + edge * 0.45 * waveAmp;

        const grad = wctx.createLinearGradient(0, centerY-h, 0, centerY+h);
        const color = (t01, a) => `rgba(0, ${Math.round(225+t01*30)}, ${Math.round(255-t01*70)}, ${a})`;
        grad.addColorStop(0, color(waveColorT, alpha*0.4));
        grad.addColorStop(0.5, color(waveColorT, alpha));
        grad.addColorStop(1, color(waveColorT, alpha*0.4));

        wctx.beginPath();
        wctx.rect(x, centerY-h, barW, h*2);
        wctx.fillStyle = grad; wctx.fill();
      }
    }

    function bootDock() {
      if(dockBooted) return;
      dockBooted = true;
      const btns = document.querySelectorAll('.dock-btn');
      btns.forEach((btn, i) => {
        setTimeout(() => {
          btn.style.opacity = '1';
          btn.style.transform = 'scale(1) translateY(0)';
          btn.classList.add('boot-glow');
          setTimeout(() => btn.classList.remove('boot-glow'), 600);
        }, i * 130);
      });
    }

    function frame() {
      boot = Math.min(1, boot + 1/bootDuration);
      ctx.clearRect(0,0,W,H);
      ctx.save(); ctx.globalAlpha = boot;
      
      // Scan
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(t*0.013);
      const or = rings[0].r;
      const sg = ctx.createLinearGradient(0,-or,0,0);
      sg.addColorStop(0,'rgba(0,210,255,0.0)'); sg.addColorStop(1,'rgba(0,210,255,0.06)');
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,or,-Math.PI/2-0.35,-Math.PI/2); ctx.closePath();
      ctx.fillStyle=sg; ctx.fill();
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-or); ctx.strokeStyle='rgba(0,210,255,0.35)';
      ctx.lineWidth=0.8; ctx.stroke(); ctx.restore();

      rings.forEach(ring => {
        const a = t * ring.speed * ring.dir;
        drawRing(ring, a, boot);
        drawTicks(ring, a);
      });

      arcs.forEach(arc => {
        const ring = rings[arc.ring];
        const ba = t * ring.speed * ring.dir;
        ctx.save(); ctx.translate(cx,cy); ctx.beginPath();
        ctx.arc(0,0,ring.r,ba+arc.startA,ba+arc.startA+arc.span*boot);
        ctx.strokeStyle=hex(arc.alpha*Math.min(boot*2,1)); ctx.lineWidth=arc.width; ctx.stroke();
        const ea = ba+arc.startA+arc.span*boot;
        ctx.beginPath(); ctx.arc(Math.cos(ea)*ring.r,Math.sin(ea)*ring.r,arc.width*1.6,0,Math.PI*2);
        ctx.fillStyle=hex(arc.alpha*0.9*Math.min(boot*2,1)); ctx.fill(); ctx.restore();
      });

      dataLines.forEach(d => {
        d.angle += d.speed;
        const pulse = 0.5 + 0.5 * Math.sin(t*0.04+d.phase);
        const r1=d.ring, r2=r1+d.len*pulse;
        ctx.beginPath(); ctx.moveTo(cx+Math.cos(d.angle)*r1,cy+Math.sin(d.angle)*r1);
        ctx.lineTo(cx+Math.cos(d.angle)*r2,cy+Math.sin(d.angle)*r2);
        ctx.strokeStyle=hex(d.alpha*pulse); ctx.lineWidth=0.7; ctx.stroke();
      });

      const bars=28, innerR=rings[5].r-6, outerMax=16, voiceAmp=0.4+0.2*Math.sin(t*0.05);
      for(let i=0;i<bars;i++){
        const a=(i/bars)*Math.PI*2;
        const h=(3+Math.abs(Math.sin(i*0.65+t*0.13)))*outerMax*voiceAmp;
        ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*innerR,cy+Math.sin(a)*innerR);
        ctx.lineTo(cx+Math.cos(a)*(innerR-h),cy+Math.sin(a)*(innerR-h));
        ctx.strokeStyle=grn(0.45+voiceAmp*0.35); ctx.lineWidth=1.3; ctx.stroke();
      }

      ctx.save();
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,52);
      g.addColorStop(0,'rgba(0,210,255,0.13)'); g.addColorStop(0.5,'rgba(0,180,255,0.04)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(cx-60,cy-60,120,120);
      [0,90,180,270].forEach(deg=>{
        const a=(deg/180)*Math.PI;
        ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*7,cy+Math.sin(a)*7);
        ctx.lineTo(cx+Math.cos(a)*18,cy+Math.sin(a)*18);
        ctx.strokeStyle='rgba(0,210,255,0.45)'; ctx.lineWidth=0.8; ctx.stroke();
      });
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor='rgba(0,210,255,0.7)';ctx.shadowBlur=20;
      ctx.fillStyle='rgba(0,225,255,0.97)'; ctx.font='700 20px Space Mono,Courier New';
      ctx.fillText('ONYX',cx+4,cy); ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(0,210,255,0.22)'; ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(cx-28,cy-13);ctx.lineTo(cx+28,cy-13);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-28,cy+13);ctx.lineTo(cx+28,cy+13);ctx.stroke();
      ctx.beginPath();ctx.arc(cx,cy+22,2,0,Math.PI*2); ctx.fillStyle='rgba(0,230,255,0.8)';
      ctx.shadowColor='rgba(0,210,255,1)';ctx.shadowBlur=8; ctx.fill(); ctx.restore();

      ctx.restore();

      const waveP = Math.max(0, Math.min(1, (boot - 0.4) / 0.6));
      drawAudioWave(waveP);

      if(boot >= 0.70) bootDock();

      const targetSpeed = isProcessing ? 2.5 : 1.0;
      speedMult += (targetSpeed - speedMult) * 0.03;
      t += speedMult;

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);

    // Dock button handlers
    btnMic.addEventListener('click', () => {
      isListening = !isListening;
      btnMic.classList.toggle('active');
      chatModal.classList.add('active');
      statusText.textContent = isListening ? 'LISTENING' : 'STANDBY';
      statusLine.classList.toggle('processing', isListening);
      if (isListening) {
        const dot = document.createElement('span');
        dot.className = 'live-dot';
        btnMic.appendChild(dot);
      } else {
        const dot = btnMic.querySelector('.live-dot');
        if (dot) dot.remove();
      }
    });

    btnAuth.addEventListener('click', () => {
      authModal.classList.toggle('active');
      btnAuth.classList.toggle('active');
    });

    btnScreen.addEventListener('click', () => {
      chatModal.classList.toggle('active');
      btnScreen.classList.toggle('active');
    });

    btnArtifact.addEventListener('click', () => {
      artifactModal.classList.toggle('active');
      btnArtifact.classList.toggle('active');
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if(key === 'v') btnMic.click();
      else if(key === 'a') btnArtifact.click();
      else if(key === 's') btnScreen.click();
      else if(key === 'l') btnAuth.click();
    });
  </script>
</body>
</html>
