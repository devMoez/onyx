<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  font-family:'Space Mono','Courier New',monospace;
  position:relative;
  overflow:hidden;
}

/* ── DOT GRID BACKGROUND ──
   Two-layer radial dot field:
   - Inner layer: denser, brighter dots near center (orb "presence")
   - Outer layer: sparser, dimmer dots at edges — both fade via a radial mask
*/
body::before{
  content:'';
  position:fixed;
  inset:0;
  /* Dense inner grid — appears brighter because dots are closer */
  background-image:radial-gradient(circle, rgba(160,175,190,0.32) 1px, transparent 1px);
  background-size:18px 18px;
  pointer-events:none;
  z-index:0;
  /* Radial mask: full opacity at center, gone by 55% radius */
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%, black 0%, black 22%, transparent 58%);
  mask-image:radial-gradient(ellipse at 50% 50%, black 0%, black 22%, transparent 58%);
}
/* Sparse outer ring — fills the rest of the canvas at low opacity */
body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:radial-gradient(circle, rgba(160,175,190,0.10) 1px, transparent 1px);
  background-size:28px 28px;
  /* Fade everything toward pure black at the canvas edges */
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%, transparent 25%, black 50%, black 70%, transparent 100%);
  mask-image:radial-gradient(ellipse at 50% 50%, transparent 25%, black 50%, black 70%, transparent 100%);
  pointer-events:none;
  z-index:1;
}

/* ── LAYOUT WRAPPER ── */
.wrapper{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  /* Reduced gap: was 0 with margin-top:2px on wave — now truly unified */
  gap:0;
}

/* Orb canvas — no change needed, sizing is handled in JS */
canvas#orb{display:block;}

/* ── AUDIO WAVE CANVAS ──
   margin-top reduced from 2px → -6px so wave reads as
   an extension of the orb rather than a separate element
*/
canvas#wave{
  display:block;
  margin-top:-6px;
}

/* ── STATUS LINE ──
   Thin text strip between wave and dock.
   Shows current AI state with animated blinking cursor.
   Font is tiny monospace to match the HUD aesthetic.
*/
.status-line{
  margin-top:10px;
  height:16px;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:9px;
  letter-spacing:0.18em;
  color:rgba(0,210,255,0.5);
  text-transform:uppercase;
  user-select:none;
  /* Smooth color transitions between states */
  transition:color 600ms ease;
}
.status-line.processing{
  color:rgba(0,255,185,0.65);
}
/* Blinking cursor after the text */
.status-cursor{
  display:inline-block;
  width:5px;height:10px;
  background:rgba(0,210,255,0.5);
  animation:cursorBlink 1.1s step-end infinite;
  vertical-align:middle;
  transition:background 600ms ease;
}
.status-line.processing .status-cursor{
  background:rgba(0,255,185,0.65);
}
@keyframes cursorBlink{
  0%,100%{opacity:1;}
  50%{opacity:0;}
}

/* ── DOCK ──
   Fully transparent, no border — unchanged from v5
*/
.dock{
  margin-top:12px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  background:transparent;
  border:none;
}

/* ── DOCK BUTTONS ──
   Base style unchanged; scale+glow boot animation added via JS.
*/
.dock-btn{
  width:44px;height:44px;
  border-radius:12px;
  border:1px solid rgba(160,175,190,0.13);
  background:rgba(160,175,190,0.04);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:all 180ms ease;
  position:relative;
  /* Starting state for boot animation — invisible and scaled down */
  opacity:0;
  transform:scale(0.7) translateY(4px);
}
.dock-btn:hover{
  background:rgba(160,175,190,0.09);
  border-color:rgba(160,175,190,0.28);
  transform:translateY(-2px) scale(1); /* preserve normal scale on hover */
}
.dock-btn:active{transform:translateY(0) scale(0.97);}
.dock-btn svg{
  width:18px;height:18px;
  stroke:rgba(165,178,192,0.7);
  fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;
  transition:stroke 180ms ease;
}
.dock-btn:hover svg{stroke:rgba(200,212,224,0.95);}

/* Active state: slightly brighter icon + underline dot */
.dock-btn.active{
  background:rgba(160,175,190,0.11);
  border-color:rgba(165,178,192,0.32);
}
.dock-btn.active svg{stroke:rgba(215,225,235,1);}
.dock-btn.active::after{
  content:'';position:absolute;
  bottom:5px;left:50%;transform:translateX(-50%);
  width:3px;height:3px;border-radius:50%;
  background:rgba(195,210,225,0.85);
}

/* ── LIVE DOT — pulsing red recording indicator ── */
.live-dot{
  position:absolute;top:7px;right:7px;
  width:5px;height:5px;border-radius:50%;
  background:#e03;
  box-shadow:0 0 5px rgba(238,0,51,0.7);
  animation:blink 1.4s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}

/* ── DOCK BUTTON BOOT GLOW ──
   Class added by JS during the staggered intro animation.
   The box-shadow gives a brief cyan glow as each button pops in.
*/
.dock-btn.boot-glow{
  box-shadow:0 0 18px rgba(0,210,255,0.28), 0 0 6px rgba(0,210,255,0.15);
}

/* ── KEYBOARD SHORTCUT TOOLTIP ──
   Appears above dock buttons on hover.
   No border, no background box — just floating monospace text.
   Uses CSS-only approach: data-tip attribute + ::before pseudo-element.
*/
.dock-btn[data-tip]::before{
  content:attr(data-tip);
  position:absolute;
  bottom:calc(100% + 10px);
  left:50%;
  transform:translateX(-50%) translateY(4px);
  font-family:'Space Mono','Courier New',monospace;
  font-size:8px;
  letter-spacing:0.12em;
  color:rgba(160,175,190,0.75);
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  transition:opacity 160ms ease, transform 160ms ease;
}
.dock-btn[data-tip]:hover::before{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>
<body>
<div class="wrapper">
  <canvas id="orb"></canvas>
  <canvas id="wave"></canvas>

  <!-- ── STATUS LINE ──
       Text content is updated by JS based on listening/processing state.
       The cursor span blinks independently via CSS animation.
  -->
  <div class="status-line" id="statusLine">
    <span id="statusText">STANDBY</span>
    <span class="status-cursor"></span>
  </div>

  <!-- ── DOCK ──
       data-tip:  keyboard shortcut shown in floating tooltip on hover
       title:     accessible label (unchanged from v5)
       Boot animation: JS adds opacity/transform transitions staggered after orb completes
  -->
  <div class="dock">
    <!-- Mic button: toggles listening / idle wave mode -->
    <button class="dock-btn active" id="btnMic" title="Live Camera" data-tip="[ V ]">
      <span class="live-dot"></span>
      <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    </button>
    <!-- Artifact button -->
    <button class="dock-btn" id="btnArtifact" title="Artifact" data-tip="[ A ]">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
    </button>
    <!-- Screen share button -->
    <button class="dock-btn" id="btnScreen" title="Screen Share" data-tip="[ S ]">
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   ONYX HUD — v6
   Changes from v5:
     1. Tighter orb↔wave gap (margin-top: -6px)
     2. Two wave modes: idle flat pulse / active tall bars (mic toggle)
     3. Wave color shifts cyan→green when processing
     4. Dock buttons boot in staggered with scale+glow animation
     5. Dot grid: dense+bright at center, sparse at edges (CSS masks)
     6. Status text line cycling STANDBY / LISTENING... / PROCESSING...
     7. Keyboard shortcut tooltips on dock hover (CSS data-tip)
   All original v5 features preserved unchanged.
═══════════════════════════════════════════════════════════════ */


/* ── ORB CANVAS SETUP ── */
const orb = document.getElementById('orb');
const ctx = orb.getContext('2d');
const W = 520, H = 520;
orb.width = W; orb.height = H;
const cx = W/2, cy = H/2;

let t = 0, boot = 0;
const bootDuration = 120;       // frames until orb is fully visible
const S = 520/680;              // scale factor relative to original 680px design


/* ── RING DEFINITIONS ──
   Each ring: radius, rotation speed, dash pattern, stroke width,
   opacity, direction (1=CW, -1=CCW), tick marks, labeled ticks
*/
const rings = [
  {r:148*S,speed:0.0018, dash:[14,7],width:0.7,alpha:0.5, dir:1, tickCount:60,labelEvery:10},
  {r:130*S,speed:-0.003, dash:[3,9], width:0.5,alpha:0.25,dir:-1,tickCount:0, labelEvery:0 },
  {r:114*S,speed:0.005,  dash:[1,0], width:1.1,alpha:0.65,dir:1, tickCount:48,labelEvery:8 },
  {r:98*S, speed:-0.007, dash:[5,5], width:0.5,alpha:0.3, dir:-1,tickCount:0, labelEvery:0 },
  {r:80*S, speed:0.011,  dash:[2,5], width:0.5,alpha:0.22,dir:1, tickCount:36,labelEvery:0 },
  {r:62*S, speed:-0.016, dash:[1,0], width:0.9,alpha:0.55,dir:-1,tickCount:0, labelEvery:0 },
];

/* Bright arc segments that ride on ring edges — give kinetic energy */
const arcs = [
  {ring:0,startA:0.2, span:1.2,width:2.2,alpha:0.85},
  {ring:0,startA:3.0, span:0.7,width:2.2,alpha:0.55},
  {ring:2,startA:0.6, span:2.0,width:2.8,alpha:0.95},
  {ring:2,startA:4.0, span:0.9,width:2.8,alpha:0.65},
  {ring:5,startA:1.2, span:2.6,width:2.0,alpha:0.8 },
];

/* Short radial data lines that orbit between the outer rings */
const dataLines = Array.from({length:10},(_,i)=>({
  angle:(i/10)*Math.PI*2,
  ring:(155+Math.random()*35)*S,
  len:14+Math.random()*28,
  alpha:0.12+Math.random()*0.22,
  speed:(Math.random()-0.5)*0.004,
  phase:Math.random()*Math.PI*2
}));

let scanAngle = 0;

/* Voice amplitude — used by the inner ring voice visualizer */
let voiceAmp = 0, voiceTarget = 0.4;
setInterval(()=>{voiceTarget=0.25+Math.random()*0.75;},900);

/* Color helpers */
const hex = a=>`rgba(0,210,255,${a})`;   // cyan — rings, scan, core
const grn = a=>`rgba(0,255,185,${a})`;   // green — voice wave (inner orb)


/* ── ORB DRAW HELPERS (unchanged from v5) ── */

function drawRing(ring,angle,p){
  const{r,dash,width,alpha}=ring;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
  ctx.beginPath();ctx.arc(0,0,r*p,0,Math.PI*2);
  ctx.setLineDash(dash[1]===0?[]:dash);
  ctx.strokeStyle=hex(alpha*Math.min(p*3,1));
  ctx.lineWidth=width;ctx.stroke();ctx.restore();
}

function drawTicks(ring,angle,p){
  if(!ring.tickCount)return;
  const{r,tickCount,labelEvery,alpha}=ring;
  for(let i=0;i<tickCount;i++){
    const a=angle+(i/tickCount)*Math.PI*2;
    const big=labelEvery&&i%labelEvery===0;
    ctx.save();ctx.translate(cx,cy);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*(r-(big?9:4)),Math.sin(a)*(r-(big?9:4)));
    ctx.lineTo(Math.cos(a)*(r+1),Math.sin(a)*(r+1));
    ctx.strokeStyle=hex(big?alpha*0.85:alpha*0.35);
    ctx.lineWidth=big?1.1:0.5;ctx.setLineDash([]);ctx.stroke();
    if(big&&labelEvery){
      const lx=Math.cos(a)*(r-16),ly=Math.sin(a)*(r-16);
      ctx.fillStyle=hex(0.28);ctx.font='7px Space Mono,Courier New';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String(i).padStart(2,'0'),lx,ly);
    }
    ctx.restore();
  }
}

function drawArcs(p){
  arcs.forEach(arc=>{
    const ring=rings[arc.ring];
    const ba=t*ring.speed*ring.dir;
    ctx.save();ctx.translate(cx,cy);
    ctx.beginPath();
    ctx.arc(0,0,ring.r,ba+arc.startA,ba+arc.startA+arc.span*p);
    ctx.setLineDash([]);
    ctx.strokeStyle=hex(arc.alpha*Math.min(p*2,1));
    ctx.lineWidth=arc.width;ctx.stroke();
    const ea=ba+arc.startA+arc.span*p;
    ctx.beginPath();
    ctx.arc(Math.cos(ea)*ring.r,Math.sin(ea)*ring.r,arc.width*1.6,0,Math.PI*2);
    ctx.fillStyle=hex(arc.alpha*0.9*Math.min(p*2,1));ctx.fill();
    ctx.restore();
  });
}

function drawScan(){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(scanAngle);
  const or=rings[0].r;
  const sg=ctx.createLinearGradient(0,-or,0,0);
  sg.addColorStop(0,'rgba(0,210,255,0.0)');
  sg.addColorStop(1,'rgba(0,210,255,0.06)');
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.arc(0,0,or,-Math.PI/2-0.35,-Math.PI/2);
  ctx.closePath();ctx.fillStyle=sg;ctx.fill();
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-or);
  ctx.strokeStyle='rgba(0,210,255,0.35)';
  ctx.lineWidth=0.8;ctx.setLineDash([]);ctx.stroke();
  ctx.restore();
  scanAngle+=0.013;
}

function drawDataLines(){
  dataLines.forEach(d=>{
    d.angle+=d.speed;
    const pulse=0.5+0.5*Math.sin(t*0.04+d.phase);
    const r1=d.ring,r2=r1+d.len*pulse;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(d.angle)*r1,cy+Math.sin(d.angle)*r1);
    ctx.lineTo(cx+Math.cos(d.angle)*r2,cy+Math.sin(d.angle)*r2);
    ctx.strokeStyle=hex(d.alpha*pulse);
    ctx.lineWidth=0.7;ctx.setLineDash([]);ctx.stroke();
  });
}

/* Inner voice visualizer — radial bars just inside ring[5] */
function drawVoiceWave(){
  voiceAmp+=(voiceTarget-voiceAmp)*0.04;
  const bars=28,innerR=rings[5].r-6,outerMax=16;
  for(let i=0;i<bars;i++){
    const a=(i/bars)*Math.PI*2;
    const h=(3+Math.abs(Math.sin(i*0.65+t*0.13))*outerMax)*voiceAmp;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*innerR,cy+Math.sin(a)*innerR);
    ctx.lineTo(cx+Math.cos(a)*(innerR-h),cy+Math.sin(a)*(innerR-h));
    ctx.strokeStyle=grn(0.45+voiceAmp*0.35);
    ctx.lineWidth=1.3;ctx.setLineDash([]);ctx.stroke();
  }
}

/* Center core: glow, crosshair lines, ONYX label, decorative lines */
function drawCore(){
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,52);
  g.addColorStop(0,'rgba(0,210,255,0.13)');
  g.addColorStop(0.5,'rgba(0,180,255,0.04)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(cx-60,cy-60,120,120);

  [0,90,180,270].forEach(deg=>{
    const a=(deg/180)*Math.PI;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*7,cy+Math.sin(a)*7);
    ctx.lineTo(cx+Math.cos(a)*18,cy+Math.sin(a)*18);
    ctx.strokeStyle='rgba(0,210,255,0.45)';
    ctx.lineWidth=0.8;ctx.setLineDash([]);ctx.stroke();
  });

  ctx.save();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,210,255,0.7)';ctx.shadowBlur=20;
  ctx.fillStyle='rgba(0,225,255,0.97)';
  ctx.font='700 20px Space Mono,Courier New';
  ctx.letterSpacing='8px';
  ctx.fillText('ONYX',cx+4,cy);
  ctx.shadowBlur=0;

  ctx.strokeStyle='rgba(0,210,255,0.22)';
  ctx.lineWidth=0.5;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(cx-28,cy-13);ctx.lineTo(cx+28,cy-13);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-28,cy+13);ctx.lineTo(cx+28,cy+13);ctx.stroke();

  ctx.beginPath();ctx.arc(cx,cy+22,2,0,Math.PI*2);
  ctx.fillStyle='rgba(0,230,255,0.8)';
  ctx.shadowColor='rgba(0,210,255,1)';ctx.shadowBlur=8;
  ctx.fill();ctx.shadowBlur=0;
  ctx.restore();
}


/* ── AUDIO WAVE CANVAS ── */
const waveC = document.getElementById('wave');
const wctx  = waveC.getContext('2d');
const WW = 260, WH = 40;
waveC.width  = WW;
waveC.height = WH;

/* ── WAVE MODE STATE ──
   isListening: toggled by the mic dock button ([ V ] shortcut or click)
   When false → idle mode: flat, low-amplitude heartbeat pulse
   When true  → active mode: tall organic bars (original v5 behaviour)
*/
let isListening = true;

/* Wave amplitude — lerps toward waveTarget each frame */
let waveAmp = 0, waveTarget = 0.5;

/* Idle amplitude target is very low — just a faint heartbeat */
const IDLE_AMP  = 0.08;
const LISTEN_AMP_MIN = 0.3, LISTEN_AMP_RANGE = 0.85;

/* Update wave target on a timer; rate and range depend on mode */
setInterval(()=>{
  if(isListening){
    waveTarget = LISTEN_AMP_MIN + Math.random() * LISTEN_AMP_RANGE;
  } else {
    // Idle: very gentle, barely-there pulse
    waveTarget = IDLE_AMP + Math.random() * 0.06;
  }
}, 700);

const BARS = 38;
const barW = 2.2;
const gap  = (WW - BARS * barW) / (BARS + 1);

/* ── WAVE COLOR ──
   waveColorT: 0 = cyan, 1 = green.
   Interpolated toward waveColorTarget each frame for smooth transition.
   Cyan = listening/idle, Green = processing.
*/
let waveColorT = 0, waveColorTarget = 0;

/* Helper: interpolate between cyan (0,225,255) and green (0,255,185) */
function waveColor(t01, alpha){
  const r = 0;
  const g = Math.round(225 + t01 * 30);   // 225 → 255
  const b = Math.round(255 - t01 * 70);   // 255 → 185
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawAudioWave(p){
  wctx.clearRect(0,0,WW,WH);

  /* Smooth amplitude and color lerps */
  waveAmp       += (waveTarget - waveAmp)       * 0.045;
  waveColorT    += (waveColorTarget - waveColorT) * 0.04;

  const centerY = WH / 2;
  const maxH    = (WH / 2) - 3;

  for(let i = 0; i < BARS; i++){
    const pos   = i / (BARS - 1);                        // 0..1
    const edge  = Math.sin(pos * Math.PI);               // envelope: tall center, tapered edges
    const wave1 = Math.abs(Math.sin(i * 0.48 + t * 0.09));
    const wave2 = Math.abs(Math.sin(i * 0.82 + t * 0.06 + 1.3));
    /* In idle mode: bars are nearly flat, driven by waveAmp being low */
    const h     = ((wave1 * 0.6 + wave2 * 0.4) * edge * maxH * waveAmp * p) + 1.5;

    const x     = gap + i * (barW + gap);
    const alpha = 0.35 + edge * 0.45 * waveAmp;

    /* Gradient shifts cyan→green as waveColorT approaches 1 (processing state) */
    const grad = wctx.createLinearGradient(0, centerY - h, 0, centerY + h);
    grad.addColorStop(0,   waveColor(waveColorT, alpha * 0.4));
    grad.addColorStop(0.5, waveColor(waveColorT, alpha));
    grad.addColorStop(1,   waveColor(waveColorT, alpha * 0.4));

    wctx.beginPath();
    wctx.roundRect(x, centerY - h, barW, h * 2, 1.5);
    wctx.fillStyle = grad;
    wctx.fill();
  }
}


/* ── STATUS LINE STATE MACHINE ──
   States: 'standby' | 'listening' | 'processing'
   Cycles automatically based on isListening + a fake processing burst.
   Text and color class update smoothly via DOM manipulation.
*/
const statusEl   = document.getElementById('statusLine');
const statusText = document.getElementById('statusText');

const STATUS_LABELS = {
  standby:    'STANDBY',
  listening:  'LISTENING',
  processing: 'PROCESSING',
};

let currentStatus = 'standby';
let processingTimer = null;

function setStatus(s){
  currentStatus = s;
  statusText.textContent = STATUS_LABELS[s];

  /* Processing gets the green class to match wave color shift */
  if(s === 'processing'){
    statusEl.classList.add('processing');
    waveColorTarget = 1;   // shift wave to green
  } else {
    statusEl.classList.remove('processing');
    waveColorTarget = 0;   // shift wave back to cyan
  }
}

/* Simulate processing bursts while in listening mode */
function maybeTriggerProcessing(){
  if(!isListening) return;
  if(Math.random() < 0.3){   // ~30% chance each cycle
    setStatus('processing');
    clearTimeout(processingTimer);
    processingTimer = setTimeout(()=>{
      if(isListening) setStatus('listening');
    }, 1800 + Math.random() * 1400);
  } else {
    if(currentStatus !== 'processing') setStatus('listening');
  }
}
setInterval(maybeTriggerProcessing, 2500);


/* ── BOOT ANIMATION ──
   Orb fades in over bootDuration frames.
   Wave fades in after orb reaches 40% opacity.
   Dock buttons pop in one-by-one after orb boot completes (70% threshold),
   each with a staggered delay, scale spring, and brief cyan glow.
*/
let orbAlpha = 0;
let dockBooted = false;   // ensures stagger fires only once

function bootDockButtons(){
  if(dockBooted) return;
  dockBooted = true;

  const btns = document.querySelectorAll('.dock-btn');
  btns.forEach((btn, i)=>{
    setTimeout(()=>{
      /* Enable transitions (they were intentionally off before boot) */
      btn.style.transition = 'opacity 320ms cubic-bezier(0.34,1.56,0.64,1), transform 320ms cubic-bezier(0.34,1.56,0.64,1), background 180ms ease, border-color 180ms ease, box-shadow 300ms ease';
      btn.style.opacity    = '1';
      btn.style.transform  = 'scale(1) translateY(0)';

      /* Brief glow flash */
      btn.classList.add('boot-glow');
      setTimeout(()=> btn.classList.remove('boot-glow'), 600);

    }, i * 130);   // 130ms stagger between each button
  });

  /* Set initial status after dock appears */
  setTimeout(()=> setStatus('standby'), 200);
}

function frame(){
  boot     = Math.min(1, boot + 1/bootDuration);
  orbAlpha = boot;

  ctx.clearRect(0,0,W,H);

  /* Draw full orb at current fade-in alpha */
  ctx.save();
  ctx.globalAlpha = orbAlpha;
  drawScan();
  rings.forEach(ring=>{
    const a=t*ring.speed*ring.dir;
    drawRing(ring,a,boot);
    drawTicks(ring,a,boot);
  });
  drawArcs(boot);
  drawDataLines();
  drawVoiceWave();
  drawCore();
  ctx.restore();

  /* Wave fades in after orb reaches 40% */
  const waveP = Math.max(0, Math.min(1, (boot - 0.4) / 0.6));
  wctx.globalAlpha = waveP;
  drawAudioWave(waveP);

  /* Trigger dock boot animation once orb is 70% visible */
  if(boot >= 0.70) bootDockButtons();

  t++;
  requestAnimationFrame(frame);
}
frame();


/* ── DOCK BUTTON INTERACTIONS ──
   Active state toggling (unchanged from v5).
   Mic button additionally toggles wave mode and status.
*/
document.querySelectorAll('.dock-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.dock-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});

/* Mic button specifically: toggle listening ↔ standby */
document.getElementById('btnMic').addEventListener('click',()=>{
  isListening = !isListening;
  clearTimeout(processingTimer);
  setStatus(isListening ? 'listening' : 'standby');
});


/* ── KEYBOARD SHORTCUTS ──
   [ V ] — toggle mic / listening mode
   [ A ] — activate artifact button
   [ S ] — activate screen share button
*/
document.addEventListener('keydown', e =>{
  const key = e.key.toLowerCase();
  if(key === 'v'){
    document.getElementById('btnMic').click();
  } else if(key === 'a'){
    document.getElementById('btnArtifact').click();
  } else if(key === 's'){
    document.getElementById('btnScreen').click();
  }
});
</script>
