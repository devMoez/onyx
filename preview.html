<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Onyx UI Full Preview</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@12.0.0/dist/framer-motion.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>body { margin: 0; background: #0c0c0e; font-family: 'Geist', sans-serif; }</style>
  </head>
  <body>
    <div id="root" style="width: 100vw; height: 100vh;"></div>
    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React;
      const { motion, AnimatePresence, useMotionValue, useSpring, useReducedMotion } = window.Motion;

      // ─── Design tokens ────────────────────────────────────────────────────────────
      const T = { bg: "#0c0c0e", surface: "#111115", panel: "#16161c", border: "rgba(255,255,255,0.07)", border2: "rgba(255,255,255,0.13)", accent: "#7c6fff", accent2: "#a78bfa", green: "#34d399", amber: "#fbbf24", red: "#f87171", text1: "#ededf0", text2: "#8888a0", text3: "#44445a" };
      const spring = { type: "spring", stiffness: 320, damping: 28 };
      const springFast = { type: "spring", stiffness: 400, damping: 30 };
      const springSlug = { type: "spring", stiffness: 180, damping: 22 };

      const PANELS = [
        { id: "terminal", icon: (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>), label: "Terminal", color: T.green, defaultSize: { w: 520, h: 320 }, defaultPos: { x: 200, y: 120 } },
        { id: "camera", icon: (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>), label: "Camera", color: T.accent, defaultSize: { w: 420, h: 280 }, defaultPos: { x: 320, y: 180 } },
        { id: "screen", icon: (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>), label: "Screen", color: T.amber, defaultSize: { w: 560, h: 360 }, defaultPos: { x: 150, y: 100 } },
        { id: "logs", icon: (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>), label: "Logs", color: T.text2, defaultSize: { w: 400, h: 280 }, defaultPos: { x: 740, y: 140 } },
        { id: "appview", icon: (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>), label: "App View", color: T.accent2, defaultSize: { w: 500, h: 360 }, defaultPos: { x: 260, y: 100 } },
      ];

      function TerminalContent() {
        const lines = [
          { t: 200,  txt: "$ onyx --init",           col: T.text1 },
          { t: 600,  txt: "> Booting neural core…",   col: T.text2 },
          { t: 1000, txt: "> Memory loaded: 1,284 ctx", col: T.text2 },
          { t: 1400, txt: "> All systems nominal ✓",  col: T.green },
          { t: 1800, txt: "$ _",                       col: T.accent, blink: true },
        ];
        const [visible, setVisible] = useState(0);
        useEffect(() => { lines.forEach((l, i) => { setTimeout(() => setVisible(i + 1), l.t); }); }, []);
        return (
          <div style={{ padding: "14px 16px", fontFamily: "'JetBrains Mono', monospace", fontSize: 12, lineHeight: 1.8, height: "100%" }}>
            {lines.slice(0, visible).map((l, i) => (
              <motion.div key={i} initial={{ opacity: 0, x: -6 }} animate={{ opacity: 1, x: 0 }} transition={{ duration: 0.18 }} style={{ color: l.col, display: "flex", alignItems: "center", gap: 0 }}>
                {l.txt}
                {l.blink && <motion.span animate={{ opacity: [1, 0] }} transition={{ repeat: Infinity, duration: 0.8 }} style={{ display: "inline-block", width: 7, height: 14, background: T.accent, marginLeft: 2, borderRadius: 1 }} />}
              </motion.div>
            ))}
          </div>
        );
      }

      function CameraContent() {
        const [beat, setBeat] = useState(false);
        useEffect(() => { const id = setInterval(() => setBeat(b => !b), 1200); return () => clearInterval(id); }, []);
        return (
          <div style={{ height: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: "#0a0a10", gap: 12, position: "relative" }}>
            <div style={{ position: "absolute", top: 10, right: 12, display: "flex", alignItems: "center", gap: 6 }}>
              <motion.div animate={{ opacity: beat ? 1 : 0.3 }} transition={{ duration: 0.3 }} style={{ width: 7, height: 7, borderRadius: "50%", background: T.red }} />
              <span style={{ fontFamily: "monospace", fontSize: 10, color: T.text2 }}>LIVE</span>
            </div>
            <div style={{ width: 80, height: 80, borderRadius: "50%", border: "1.5px solid #ffffff22", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <motion.div animate={{ scale: beat ? 1.08 : 1 }} transition={spring} style={{ width: 48, height: 48, borderRadius: "50%", background: `${T.accent}22`, border: `1px solid ${T.accent}44`, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={T.accent} strokeWidth="1.5"><circle cx="12" cy="10" r="4"/><path d="M6 21v-1a6 6 0 0112 0v1"/></svg>
              </motion.div>
            </div>
            <span style={{ fontSize: 11, color: T.text2, fontFamily: "monospace" }}>Waiting for feed…</span>
          </div>
        );
      }

      function ScreenContent() {
        return (
          <div style={{ height: "100%", background: "#0e0e14", display: "flex", flexDirection: "column" }}>
            <div style={{ height: 28, background: "#1a1a22", borderBottom: "0.5px solid rgba(255,255,255,0.07)", display: "flex", alignItems: "center", padding: "0 10px", gap: 8 }}>
              {["#f87171","#fbbf24","#34d399"].map((c, i) => <div key={i} style={{ width: 8, height: 8, borderRadius: "50%", background: c, opacity: 0.7 }} />)}
              <div style={{ flex: 1, background: "#111118", borderRadius: 4, height: 16, margin: "0 8px", display: "flex", alignItems: "center", padding: "0 8px" }}><span style={{ fontSize: 10, color: T.text3, fontFamily: "monospace" }}>onyx://controlled-view</span></div>
            </div>
            <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 8 }}>
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke={T.text3} strokeWidth="1.2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
              <span style={{ fontSize: 11, color: T.text3, fontFamily: "monospace" }}>No app selected</span>
            </div>
          </div>
        );
      }

      function LogsContent() {
        const entries = [{ t: "09:41:22", msg: "Session started", level: "info" }, { t: "09:41:23", msg: "Memory context loaded (1,284 entries)", level: "info" }, { t: "09:41:25", msg: "Web search tool: active", level: "ok" }, { t: "09:41:28", msg: "Code runner: sandboxed", level: "ok" }, { t: "09:41:30", msg: "Voice input: listening…", level: "warn" }];
        const col = { info: T.text2, ok: T.green, warn: T.amber, err: T.red };
        return (
          <div style={{ padding: "10px 14px", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, lineHeight: 1.9, height: "100%", overflowY: "auto" }}>
            {entries.map((e, i) => (
              <motion.div key={i} initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: i * 0.08 }} style={{ display: "flex", gap: 12, color: col[e.level] }}>
                <span style={{ color: T.text3, minWidth: 60 }}>{e.t}</span>
                <span>{e.msg}</span>
              </motion.div>
            ))}
          </div>
        );
      }

      function AppViewContent() {
        return (
          <div style={{ height: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 10 }}>
            <div style={{ width: 44, height: 44, borderRadius: 12, border: "1px dashed rgba(255,255,255,0.13)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={T.text3} strokeWidth="1.2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            </div>
            <span style={{ fontSize: 12, color: T.text3, fontFamily: "monospace" }}>ONYX controls an app here</span>
          </div>
        );
      }

      const PANEL_CONTENT = { terminal: TerminalContent, camera: CameraContent, screen: ScreenContent, logs: LogsContent, appview: AppViewContent };

      function FloatingPanel({ panel, onClose, zIndex, onFocus }) {
        const Content = PANEL_CONTENT[panel.id];
        return (
          <motion.div
            initial={{ opacity: 0, scale: 0.92, y: 16 }}
            animate={{ opacity: 1, scale: 1, y: 0 }}
            exit={{ opacity: 0, scale: 0.94, y: 10 }}
            transition={spring}
            style={{
              position: "absolute", left: panel.defaultPos.x, top: panel.defaultPos.y, width: panel.defaultSize.w, height: panel.defaultSize.h,
              zIndex, background: T.panel, border: "0.5px solid rgba(255,255,255,0.13)", borderRadius: 12, overflow: "hidden", display: "flex", flexDirection: "column", boxShadow: "0 24px 64px rgba(0,0,0,0.5)"
            }}
            onMouseDown={onFocus}
          >
            <div style={{ height: 38, background: T.surface, borderBottom: "0.5px solid rgba(255,255,255,0.07)", display: "flex", alignItems: "center", padding: "0 12px", gap: 8 }}>
              <div style={{ color: panel.color, display: "flex" }}>{panel.icon}</div>
              <span style={{ fontSize: 12, fontWeight: 500, color: T.text1 }}>{panel.label}</span>
              <button onClick={onClose} style={{ marginLeft: "auto", background: "none", border: "none", cursor: "pointer", color: T.red }}>✕</button>
            </div>
            <div style={{ flex: 1, overflow: "hidden" }}><Content /></div>
          </motion.div>
        );
      }

      function OnyxApp() {
        const [openPanels, setOpenPanels] = useState(["terminal"]);
        const [zOrders, setZOrders] = useState({ terminal: 10 });
        const [zTop, setZTop] = useState(10);
        
        const togglePanel = (panelId) => {
          setOpenPanels(prev => prev.includes(panelId) ? prev.filter(id => id !== panelId) : [...prev, panelId]);
        };

        return (
          <div style={{ width: "100%", height: "100vh", background: T.bg, color: T.text1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
            <div style={{ flex: 1, position: "relative" }}>
              {openPanels.map(panelId => {
                const panel = PANELS.find(p => p.id === panelId);
                return <FloatingPanel key={panelId} panel={panel} zIndex={zOrders[panelId] || 10} onClose={() => togglePanel(panelId)} onFocus={() => setZTop(z => z + 1)} />
              })}
            </div>
            <div style={{ height: 64, background: T.surface, borderTop: "0.5px solid rgba(255,255,255,0.07)", display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
              {PANELS.map(panel => (
                <button key={panel.id} onClick={() => togglePanel(panel.id)} style={{ width: 44, height: 44, borderRadius: 12, background: openPanels.includes(panel.id) ? panel.color + "22" : T.surface, border: "0.5px solid rgba(255,255,255,0.07)", cursor: "pointer", color: openPanels.includes(panel.id) ? panel.color : T.text2 }}>
                  {panel.icon}
                </button>
              ))}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<OnyxApp />);
    </script>
  </body>
</html>
